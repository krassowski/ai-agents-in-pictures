name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the website
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the fonts and the Python packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-core fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Draw the figures
        run: |
          for script in figures/llm-*.py; do
            python "$script"
          done
      - name: Check that the committed figures match the scripts
        run: |
          if ! git diff --exit-code --stat -- '*.svg'; then
            echo '::error::The scripts draw different SVG files. Run them and commit the SVG files.'
            exit 1
          fi
      - name: Build the website
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python scripts/build-site.py --out _site --base-url "$BASE_URL" --repo-url "$REPO_URL"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    name: Publish it on GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write  # to publish the site
      id-token: write  # to show GitHub Pages that this workflow built it
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
